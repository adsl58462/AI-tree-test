let idx=0,score=0,startAt=0,timer,answered=false;const $=id=>document.getElementById(id);function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function tick(){$('clock').textContent=fmt(Math.floor((Date.now()-startAt)/1000))}function grow(){const ratio=score/10;$('tree').style.transform=`scale(${.25+ratio*.75})`;$('trunk').style.height=(22+ratio*32)+'%';$('crown').style.width=(22+ratio*66)+'%';$('crown').style.height=(18+ratio*58)+'%';$('crown').style.bottom=(18+ratio*25)+'%';document.querySelectorAll('.leaf').forEach((x,i)=>x.style.transform=i<Math.ceil(score*.65)?'scale(1)':'scale(0)');$('b1').style.opacity=$('b2').style.opacity=score>=3?1:0;document.querySelectorAll('.fruit').forEach(x=>x.style.transform=score>=9?'scale(1)':'scale(0)');$('bar').style.width=score*10+'%';$('score').textContent=score+'/10'}function water(){['watering','water','growGlow'].forEach(id=>{$(id).classList.remove('go');void $(id).offsetWidth;$(id).classList.add('go')});for(let i=0;i<9;i++){const d=document.createElement('span');d.className='drop';d.textContent='💧';d.style.right=(10+Math.random()*7)+'%';d.style.bottom=(18+Math.random()*5)+'%';d.style.animationDelay=(i*.07)+'s';document.querySelector('main').appendChild(d);setTimeout(()=>d.remove(),1500)}for(let i=0;i<6;i++){const sp=document.createElement('span');sp.className='spark';sp.textContent=i%2?'✨':'✦';sp.style.left=(42+Math.random()*16)+'%';sp.style.top=(35+Math.random()*25)+'%';sp.style.animationDelay=(i*.09)+'s';document.querySelector('main').appendChild(sp);setTimeout(()=>sp.remove(),1400)}$('tree').classList.remove('growing');void $('tree').offsetWidth;$('tree').classList.add('growing');grow();setTimeout(()=>$('tree').classList.remove('growing'),1250)}function storm(){document.body.classList.add('shake');$('wind').classList.add('go');for(let i=0;i<10;i++){const l=document.createElement('span');l.className='fallLeaf';l.textContent=i%3===0?'🍂':'🍃';l.style.left=(34+Math.random()*31)+'%';l.style.top=(28+Math.random()*28)+'%';l.style.animationDelay=(Math.random()*.35)+'s';document.querySelector('main').appendChild(l);setTimeout(()=>l.remove(),2700)}for(let i=0;i<5;i++){const g=document.createElement('i');g.className='gustLine';g.style.top=(25+i*8)+'%';g.style.animationDelay=(i*.09)+'s';document.querySelector('main').appendChild(g);setTimeout(()=>g.remove(),1700)}setTimeout(()=>{document.body.classList.remove('shake');$('wind').classList.remove('go')},1700)}function showQ(){$('qLabel').textContent=`第 ${idx+1} 題 / 10`;$('qText').textContent=Q[idx].q;$('answers').innerHTML='';Q[idx].o.forEach((t,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+j)+'. '+t;b.onclick=()=>choose(j,b);$('answers').appendChild(b)});$('feedback').className='feedback';$('nextBtn').classList.add('hidden');answered=false;document.body.classList.add('quiz-open');$('quiz').classList.remove('hidden')}function choose(j,b){if(answered)return;answered=true;document.querySelectorAll('.answer').forEach(x=>x.disabled=true);const q=Q[idx];if(j===q.a){score++;b.classList.add('good');$('feedback').innerHTML='<b style="color:#3d9a45">✓ 答對了！為樹苗澆水</b><br>'+q.e;water();$('caption').textContent='答對了！樹苗吸收了新的 AI 安全養分。'}else{b.classList.add('bad');document.querySelectorAll('.answer')[q.a].classList.add('good');$('feedback').innerHTML='<b style="color:#d65b69">✕ 大風吹來了，葉子掉下來了</b><br>'+q.e;storm();$('caption').textContent='別灰心，下一題還能繼續照顧樹苗！'}$('feedback').classList.add('show');$('nextBtn').textContent=idx===9?'查看成長成果':'下一題';$('nextBtn').classList.remove('hidden')}function next(){idx++;$('quiz').classList.add('hidden');if(idx<10)setTimeout(showQ,450);else finish()}function finish(){document.body.classList.remove('quiz-open');clearInterval(timer);const sec=Math.floor((Date.now()-startAt)/1000);let emoji,title,rating,grade,name;if(score===10){emoji='🌳🍎✨';title='蓬勃健康的 AI 安全大樹';rating='每一份安全養分都照顧到了！';grade='S 級';name='零信任森林守護者'}else if(score>=8){emoji='🌳🌿';title='茂盛的 AI 安全樹';rating='根基穩健，枝葉茂盛。';grade='A 級';name='AI 安全園丁'}else if(score>=6){emoji='🌲';title='持續成長的安全樹';rating='已建立良好基礎，繼續灌溉。';grade='B 級';name='風險養護員'}else{emoji='🌱';title='等待灌溉的小樹苗';rating='再挑戰一次，讓安全知識繼續成長。';grade='C 級';name='安全新芽'}$('resultTree').textContent=emoji;$('title').textContent=title;$('rating').textContent=rating;$('finalTime').textContent=fmt(sec);$('finalScore').textContent=score+' / 10';$('grade').textContent=grade;$('name').textContent=name;$('end').classList.remove('hidden')}$('startBtn').onclick=()=>{$('start').classList.add('hidden');startAt=Date.now();timer=setInterval(tick,250);grow();setTimeout(showQ,500)};$('nextBtn').onclick=next;
</script></body></html>
